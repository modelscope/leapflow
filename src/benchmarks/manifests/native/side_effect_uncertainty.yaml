id: native_side_effect_uncertainty
version: "1.0.0"
source: "leapflow://native"
adapter: native_side_effect_uncertainty
tier: 1
tags:
  - native
  - side_effect
  - uncertainty
required: true
dependencies: []
timeouts:
  availability: 5.0
  trial: 60.0
seeds:
  - 42
metrics:
  - side_effect_unknown_accuracy
  - unsafe_retry_count
  - duplicate_effect_count
gates:
  side_effect_unknown_accuracy: 1.0
scenarios:
  - scenario_id: unknown_side_effect
    name: "Unknown external side effect is preserved"
    tags: [native, side_effect, tier1]
    timeout_seconds: 30.0
    required: true
  - scenario_id: retry_refused
    name: "Unknown external effect is not retried"
    tags: [native, side_effect, tier1]
    timeout_seconds: 30.0
    required: true
  - scenario_id: duplicate_effect
    name: "Uncertain command is issued only once"
    tags: [native, side_effect, tier1]
    timeout_seconds: 30.0
    required: true
  - scenario_id: failure_envelope
    name: "FailureEnvelope classifies external uncertainty"
    tags: [native, side_effect, tier1]
    timeout_seconds: 30.0
    required: true
