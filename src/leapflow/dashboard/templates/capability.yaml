# Adaptive capability decision template for LeapBoard.
template: capability
version: 1
title: "Capability adaptation"
domain: capability_adaptation
meta:
  title: "Capability adaptation"
  description: "Shows adaptive plugin capability decisions, selected tools, and plan order."
layout:
  - type: Page
    props:
      title: "Capability adaptation"
    children:
      - type: Section
        props:
          title: "Latest capability decision"
          subtitle: "Environment, selected plugin tools, and orchestration order."
        children:
          - type: Grid
            props:
              cols: 3
            children:
              - type: Stat
                props:
                  label: "Environment"
                  value: "{{ capability_plan.environment.fingerprint_id }}"
              - type: Stat
                props:
                  label: "Plan"
                  value: "{{ capability_plan.plan.plan_id }}"
              - type: Stat
                props:
                  label: "Executable"
                  value: "{{ capability_plan.plan.executable }}"
              - type: Stat
                props:
                  label: "Loop phase"
                  value: "{{ capability_plan.phase }}"
              - type: Stat
                props:
                  label: "Mutation"
                  value: "{{ capability_plan.mutation.action }}"
              - type: Stat
                props:
                  label: "Registry delta"
                  value: "{{ capability_plan.registry_version_before }} → {{ capability_plan.registry_version_after }}"
          - type: Table
            when: capability_plan.requirements
            props:
              title: "Requirements"
              columns:
                - key: capability
                  label: "Capability"
                - key: origin
                  label: "Origin"
                - key: evidence
                  label: "Evidence"
              bind: capability_plan.requirements
          - type: Table
            when: capability_plan.plan.steps
            props:
              title: "Plan steps"
              columns:
                - key: tool_name
                  label: "Tool"
                - key: plugin_id
                  label: "Plugin"
                - key: execution_policy
                  label: "Policy"
                - key: requires_approval
                  label: "Approval"
              bind: capability_plan.plan.steps
          - type: Table
            when: capability_plan.decision_delta.changed
            props:
              title: "Selection delta"
              columns:
                - key: key
                  label: "Capability"
                - key: before
                  label: "Before"
                - key: after
                  label: "After"
              bind: capability_plan.decision_delta.changed
      - type: Section
        props:
          title: "Autonomous governance"
          subtitle: "Observation backlog, proposal state, policy decisions, and lifecycle outcomes."
        children:
          - type: Grid
            props:
              cols: 4
            children:
              - type: Stat
                props:
                  label: "Observations"
                  value: "{{ capability_plan.observation_count }}"
              - type: Stat
                props:
                  label: "Proposal"
                  value: "{{ capability_plan.proposal.proposal_id }}"
              - type: Stat
                props:
                  label: "Proposal status"
                  value: "{{ capability_plan.proposal.status }}"
              - type: Stat
                props:
                  label: "Autonomy"
                  value: "{{ capability_plan.policy_decision.autonomy_level }}"
          - type: Table
            when: capability_plan.governance_results
            props:
              title: "Lifecycle timeline"
              columns:
                - key: action
                  label: "Action"
                - key: plugin_id
                  label: "Plugin"
                - key: trust_level
                  label: "Trust"
                - key: failure_streak
                  label: "Failures"
              bind: capability_plan.governance_results
