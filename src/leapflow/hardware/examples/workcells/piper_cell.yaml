# Piper + RealSense workcell: which devices cooperate, in which frames, inside which box.
#
# Place in <profile>/hardware/workcells/ next to the device declarations it
# binds (examples: piper_arm.yaml, realsense_435if.yaml, perception_locator.yaml,
# policy_smolvla.yaml). Check it offline before deploying:
#
#     leap hw validate --workcells <this dir> --devices <devices dir>
#
# Admission is fail-closed: an unknown field, a role naming an undeclared
# device, an arm without toleranced pose/joint channels, a speed cap below the
# arm's slowest commandable speed, or a policy binding naming a channel the
# arm does not declare all refuse the workcell, with the reason reported.
#
# Geometry is never declared inline. Frames and the workspace resolve from
# versioned calibration records written by the calib.* skills; until they
# exist only calib.* is available, and only inside bootstrap_box.

workcell: piper_cell

# Role name -> device id. A role's kind is its first dotted segment, so a
# second camera binds as e.g. ``camera.wrist: <device id>``.
roles:
  arm: robot_piper_arm
  gripper: robot_piper_arm
  camera: sensor_realsense_435if

# Each frame names its parent and the calibration procedure that measures it.
frames:
  tcp: {parent: flange, procedure: tcp.offset}
  camera: {parent: base, procedure: handeye.eye_to_hand}

workspace:
  procedure: workspace.safe_box
  tool_cone_deg: 30
  # The conservative box calib.* may move in before the workspace is measured
  # (base frame, mm). Keep it well clear of the table and the camera mount.
  bootstrap_box: {x: [150, 400], y: [-200, 200], z: [120, 400]}

# Omitted: the arm declaration's kinematics.home_joint_targets.
# home: {joint.j1.position: 0.0, joint.j2.position: 0.0}

# max_width_mm defaults to the gripper.position envelope's max_value.
gripper_spec: {max_width_mm: 70, min_hold_width_mm: 3}

limits:
  speed_pct_max: 30
  default_speed_pct: 20
  move_timeout_s: 20
  max_steps: 16      # steps one motion.sequence may carry (one approval)
  max_wait_s: 10     # longest single ``wait`` step

# How far the world may move between an approved plan and its execution
# before the run answers plan_stale instead of acting on an old view.
freshness:
  drift_planar_mm: 8
  drift_height_mm: 10
  drift_yaw_deg: 10
  hold_tolerance_mm: 5

# Acceptance thresholds of the calib.* skills.
calibration:
  max_tool_length_mm: 400
  max_table_residual_mm: 3
  min_hand_eye_poses: 6

# Model name -> model-service device id. ``locator`` serves perceive.locate;
# every other name is a policy embodied under ``policies`` below.
models:
  locator: perception_locator
  pick_cube: policy_smolvla

# The baseline geometric planner; ``planner: model`` with
# ``models: {grasp: <grasp_proposal device>}`` makes a learned one primary.
grasp:
  planner: top_down
  approach_mm: 80
  retreat_mm: 80

perception:
  min_score: 0.3       # candidates below this are not reported at all
  memory_ttl_s: 30     # how long a located object id stays referable

# Policy streaming tuning; the shield's limits come from the device
# declarations only, so nothing here (or in the model) can widen them.
policy:
  tick_hz: 50
  max_jump_s: 1.0

# How each served policy embodies here. The model declares its native spaces
# in model_info; this binds its groups to channels and its cameras to roles.
policies:
  pick_cube:
    actions:
      arm:
        - joint.j1.position
        - joint.j2.position
        - joint.j3.position
        - joint.j4.position
        - joint.j5.position
        - joint.j6.position
      gripper: [gripper.position]
    cameras: {top: camera}
    aggregate: crossfade

# The ChArUco board calib.handeye observes.
calibration_target: {type: charuco, squares_x: 5, squares_y: 4, square_mm: 30, marker_mm: 22}

# Camera frames stay on the node unless the operator opts in here *and* the
# host sets hardware.share_frames (perceive.snapshot).
share_frames: false
