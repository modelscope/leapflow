# AgileX Piper — 6-DOF CAN-controlled arm with a parallel gripper.
#
# hc.v1 declaration for the node-local Piper transport
# (leapflow.hardware.drivers.piper). Joint envelope bounds are the Piper
# firmware joint limits in degrees; end-effector (ee.*) envelopes are the
# reachable workspace box in the arm base frame (mm) and the full orientation
# range (deg). A batch may command joint.* or ee.* targets, never both.
# Every writable numeric channel declares
# `tolerance` explicitly: write verification defaults to an exact match
# when tolerance is unset, and a servos' readback never matches a target
# to the last bit.

hc_version: "hc.v1"
# Registry admission (V2) only admits [a-z0-9_]+ device ids -- no dots.
device_id: "robot_piper_arm"
display_name: "AgileX Piper Arm"
device_class: "robot_arm"
vendor: "AgileX"
model: "Piper"
location: "workbench_1"
halt_supported: true

kinematics:
  chain_type: "serial"
  dof: 6
  # Firmware joint limits, converted to radians.
  joint_limits:
    - [-2.618, 2.618]    # j1: ±150 deg
    - [0.0, 3.142]       # j2: 0..180 deg
    - [-2.967, 0.0]      # j3: -170..0 deg
    - [-1.745, 1.745]    # j4: ±100 deg
    - [-1.222, 1.222]    # j5: ±70 deg
    - [-2.094, 2.094]    # j6: ±120 deg
  workspace_bounds: [-0.65, 0.65, -0.65, 0.65, -0.3, 0.9]
  # Modified (Craig) DH, base to flange, from piper_sdk C_PiperForwardKinematics
  # with dh_is_offset=0x01 (current firmware). Older firmware uses theta
  # offsets -174.22 / -100.78 on links 2 / 3. The node checks this table against
  # the reported flange pose before predicting with it, so a mismatch fails closed.
  # VERIFY ON BOARD: compare forward(joints) with ee.* at a few poses.
  dh:
    convention: modified
    links:
      - {a: 0.0, alpha: 0.0, d: 123.0, theta_offset: 0.0}
      - {a: 0.0, alpha: -90.0, d: 0.0, theta_offset: -172.22}
      - {a: 285.03, alpha: 0.0, d: 0.0, theta_offset: -102.78}
      - {a: -21.98, alpha: 90.0, d: 250.75, theta_offset: 0.0}
      - {a: 0.0, alpha: -90.0, d: 0.0, theta_offset: 0.0}
      - {a: 0.0, alpha: 90.0, d: 91.0, theta_offset: 0.0}

capabilities:
  payload_kg: 1.5
  reach_m: 0.65
  tool_slots: 1

safety:
  max_velocity_rad_s: 3.14
  max_force_n: 30.0
  emergency_decel_s: 0.2
  notes: >-
    halt() maps to the vendor hardware emergency stop (CAN 0x150).
    Resume (0x02) is a separate governed write; DisableArm and ResetPiper
    release torque and drop the arm, so neither is ever part of a halt.

trust_config:
  initial_level: "UNTRUSTED"
  promotion_thresholds: [3, 8, 20]
  demotion_threshold: 3

degradation:
  sensor_loss_policy: "halt"
  comm_loss_policy: "halt"
  max_comm_loss_s: 1.0

transport:
  kind: "piper"
  config:
    can_name: "can0"
    sdk_interface: "v2"
    default_speed_pct: 20
    # ee.* targets until arm.pose_path selects otherwise: "linear" (MOVE L,
    # straight-line) or "point" (MOVE P).
    pose_move_mode: "linear"
    warmup_timeout_s: 5.0
    stale_after_s: 1.0
    default_effort_n_m: 0.5

channels:
  - channel_id: "joint.j1.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 1 (base yaw) position"
    envelope:
      declared: true
      min_value: -150.0
      max_value: 150.0
      max_rate: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j2.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 2 (shoulder) position"
    envelope:
      declared: true
      min_value: 0.0
      max_value: 180.0
      max_rate: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j3.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 3 (elbow) position"
    envelope:
      declared: true
      min_value: -170.0
      max_value: 0.0
      max_rate: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j4.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 4 (wrist pitch) position"
    envelope:
      declared: true
      min_value: -100.0
      max_value: 100.0
      max_rate: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j5.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 5 (wrist roll) position"
    envelope:
      declared: true
      min_value: -70.0
      max_value: 70.0
      max_rate: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j6.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 6 (flange rotation) position"
    envelope:
      declared: true
      min_value: -120.0
      max_value: 120.0
      max_rate: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "ee.x"
    direction: "readwrite"
    quantity: "linear_position"
    unit: "mm"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector X in the arm base frame"
    envelope:
      declared: true
      min_value: -650.0
      max_value: 650.0
      max_rate: 150.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 2.0
      reversible: true

  - channel_id: "ee.y"
    direction: "readwrite"
    quantity: "linear_position"
    unit: "mm"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector Y in the arm base frame"
    envelope:
      declared: true
      min_value: -650.0
      max_value: 650.0
      max_rate: 150.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 2.0
      reversible: true

  - channel_id: "ee.z"
    direction: "readwrite"
    quantity: "linear_position"
    unit: "mm"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector Z in the arm base frame"
    envelope:
      declared: true
      min_value: -300.0
      max_value: 900.0
      max_rate: 150.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 2.0
      reversible: true

  - channel_id: "ee.rx"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector roll (RX) in the arm base frame"
    envelope:
      declared: true
      min_value: -180.0
      max_value: 180.0
      max_rate: 45.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 1.0
      reversible: true

  - channel_id: "ee.ry"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector pitch (RY) in the arm base frame"
    envelope:
      declared: true
      min_value: -180.0
      max_value: 180.0
      max_rate: 45.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 1.0
      reversible: true

  - channel_id: "ee.rz"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector yaw (RZ) in the arm base frame"
    envelope:
      declared: true
      min_value: -180.0
      max_value: 180.0
      max_rate: 45.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 1.0
      reversible: true

  - channel_id: "gripper.position"
    direction: "readwrite"
    quantity: "linear_position"
    unit: "mm"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Gripper stroke"
    envelope:
      declared: true
      min_value: 0.0
      max_value: 100.0
      quantization: 0.001
      settling_time_s: 0.3
      tolerance: 0.5
      reversible: true

  - channel_id: "gripper.effort"
    direction: "readwrite"
    quantity: "torque"
    unit: "N_m"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: false
    description: "Gripper holding effort; the vendor frame always carries stroke and effort together"
    envelope:
      declared: true
      min_value: 0.0
      max_value: 5.0
      quantization: 0.001
      tolerance: 0.05
      reversible: true

  - channel_id: "arm.enable"
    direction: "write"
    quantity: "state"
    representation: "state"
    effect: "configure"
    description: >-
      Energize (1) or release (0) all motors. Energize first resumes a latched
      emergency stop (CAN 0x150/0x02) then enables all motors, under one
      approval; this is the only resume path. Release drops torque and the
      arm can fall; neither direction is ever part of a halt.
    envelope:
      declared: true
      allowed_values: [0, 1]
      reversible: true

  - channel_id: "arm.speed_pct"
    direction: "readwrite"
    quantity: "ratio"
    unit: "percent"
    representation: "scalar"
    effect: "configure"
    description: >-
      Motion speed rate carried by the next mode selection (1-100 % of the
      firmware maximum). Sends no frame on its own; the next motion applies it.
    envelope:
      declared: true
      min_value: 1.0
      max_value: 100.0
      quantization: 1.0
      reversible: true

  - channel_id: "arm.pose_path"
    direction: "readwrite"
    quantity: "state"
    representation: "state"
    effect: "configure"
    description: >-
      Path shape of later end-effector pose targets: "linear" (MOVE L,
      straight-line) or "point" (MOVE P, joint-interpolated). Sends no frame on
      its own; the next pose move applies it. The first allowed value is the
      path a move uses when it names none.
    envelope:
      declared: true
      allowed_values: ["linear", "point"]
      reversible: true

  - channel_id: "arm.enabled"
    direction: "read"
    quantity: "state"
    representation: "state"
    effect: "read"
    description: "True when every motor reports enabled"

  - channel_id: "arm.status"
    direction: "read"
    quantity: "state"
    representation: "state"
    effect: "read"
    description: "Vendor feedback status: ctrl_mode, arm_status, motion_status"

  - channel_id: "arm.motion"
    direction: "read"
    quantity: "state"
    representation: "state"
    effect: "read"
    description: "True when the arm reports it arrived at the commanded target"
