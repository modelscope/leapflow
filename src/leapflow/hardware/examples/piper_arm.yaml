# AgileX Piper X -- 6-DOF CAN-controlled arm with a parallel gripper.
#
# hc.v1 declaration for the node-local Piper transport
# (leapflow.hardware.drivers.piper, built on the pyAgxArm SDK). Joint envelope
# bounds are the Piper X firmware joint limits in degrees (pyAgxArm
# ROBOT_JOINT_LIMIT_PRESET_RAD["piper_x"]); end-effector (ee.*) envelopes are
# the reachable workspace box in the arm base frame (mm) and the orientation
# range (deg). A batch may command joint.* or ee.* targets, never both.
# Every writable numeric channel declares
# `tolerance` explicitly: write verification defaults to an exact match
# when tolerance is unset, and a servos' readback never matches a target
# to the last bit.

hc_version: "hc.v1"
# Registry admission (V2) only admits [a-z0-9_]+ device ids -- no dots.
device_id: "robot_piper_arm"
display_name: "AgileX Piper X Arm"
device_class: "robot_arm"
vendor: "AgileX"
model: "Piper X"
location: "workbench_1"
halt_supported: true

kinematics:
  chain_type: "serial"
  dof: 6
  # Piper X firmware joint limits, in radians.
  joint_limits:
    - [-2.618, 2.618]    # j1: ±150 deg
    - [0.0, 3.142]       # j2: 0..180 deg
    - [-2.967, 0.0]      # j3: -170..0 deg
    - [-1.553, 1.553]    # j4: ±89 deg
    - [-1.553, 1.553]    # j5: ±89 deg
    - [-2.967, 2.967]    # j6: ±170 deg
  workspace_bounds: [-0.65, 0.65, -0.65, 0.65, -0.3, 0.9]
  # Modified (Craig) DH, base to flange: pyAgxArm ROBOT_MDH_PRESET["piper_x"]
  # (m/rad converted to mm/deg). Verified on the Piper X (S-V1.9-0): forward
  # kinematics of the reported joints matched the firmware flange pose with
  # 0.0 mm / 0.0 deg error. The node checks this table against the reported
  # flange pose before predicting with it, so a mismatch fails closed.
  dh:
    convention: modified
    links:
      - {a: 0.0, alpha: 0.0, d: 123.0, theta_offset: 180.0}
      - {a: 0.0, alpha: 90.0, d: 0.0, theta_offset: 7.78}
      - {a: 285.03, alpha: 0.0, d: 0.0, theta_offset: 162.61}
      - {a: 273.64, alpha: 0.0, d: 0.0, theta_offset: 4.62}
      - {a: 74.66, alpha: -90.0, d: 0.0, theta_offset: 90.0}
      - {a: 0.0, alpha: 90.0, d: 35.26, theta_offset: 0.0}

capabilities:
  payload_kg: 1.5
  reach_m: 0.65
  tool_slots: 1

safety:
  max_velocity_rad_s: 3.14
  max_force_n: 30.0
  emergency_decel_s: 0.2
  notes: >-
    halt() maps to pyAgxArm electronic_emergency_stop() (a damped stop).
    Resume (reset()) is a separate governed write on arm.enable; disable()
    releases torque and drops the arm, so neither is ever part of a halt.

trust_config:
  initial_level: "UNTRUSTED"
  promotion_thresholds: [3, 8, 20]
  demotion_threshold: 3

degradation:
  sensor_loss_policy: "halt"
  comm_loss_policy: "halt"
  max_comm_loss_s: 1.0

transport:
  kind: "piper"
  config:
    # The node-local CAN interface the arm answers on: the native mttcan
    # controller on some carriers, or the interface a USB-CAN adapter creates
    # (``can1`` on JetPack, where gs_usb must be installed).
    can_name: "can0"
    # pyAgxArm model + firmware profile. Bring-up reads the arm's firmware
    # version and refuses to open when it resolves to a different profile
    # (S-V1.8-9 and later -> v189).
    robot: "piper_x"
    firmware_profile: "v189"
    default_speed_pct: 20
    # Bound on the confirmation that the arm entered CAN control.
    mode_switch_timeout_s: 0.6
    # ee.* targets until arm.pose_path selects otherwise: "linear" (move_l,
    # straight-line) or "point" (move_p).
    pose_move_mode: "linear"
    warmup_timeout_s: 5.0
    stale_after_s: 1.0
    receive_max_skew_s: 0.15
    default_gripper_force_n: 1.0

channels:
  - channel_id: "arm.telemetry"
    direction: "read"
    quantity: "arm_diagnostics"
    representation: "state"
    effect: "read"
    description: "Per-motor receive age/counters, current-derived effort, speed, voltage, motor/driver temperature, enable and faults; not measured force."
  - channel_id: "joint.j1.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 1 (base yaw) position"
    envelope:
      declared: true
      min_value: -150.0
      max_value: 150.0
      max_rate: 36.0
      max_jump: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j2.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 2 (shoulder) position"
    envelope:
      declared: true
      min_value: 0.0
      max_value: 180.0
      max_rate: 36.0
      max_jump: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j3.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 3 (elbow) position"
    envelope:
      declared: true
      min_value: -170.0
      max_value: 0.0
      max_rate: 36.0
      max_jump: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j4.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 4 (wrist pitch) position"
    envelope:
      declared: true
      min_value: -89.0
      max_value: 89.0
      max_rate: 36.0
      max_jump: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j5.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 5 (wrist roll) position"
    envelope:
      declared: true
      min_value: -89.0
      max_value: 89.0
      max_rate: 36.0
      max_jump: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "joint.j6.position"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Joint 6 (flange rotation) position"
    envelope:
      declared: true
      min_value: -170.0
      max_value: 170.0
      max_rate: 36.0
      max_jump: 36.0
      quantization: 0.001
      settling_time_s: 0.5
      tolerance: 0.5
      reversible: true

  - channel_id: "ee.x"
    direction: "readwrite"
    quantity: "linear_position"
    unit: "mm"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector X in the arm base frame"
    envelope:
      declared: true
      min_value: -650.0
      max_value: 650.0
      max_rate: 150.0
      max_jump: 150.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 2.0
      reversible: true

  - channel_id: "ee.y"
    direction: "readwrite"
    quantity: "linear_position"
    unit: "mm"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector Y in the arm base frame"
    envelope:
      declared: true
      min_value: -650.0
      max_value: 650.0
      max_rate: 150.0
      max_jump: 150.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 2.0
      reversible: true

  - channel_id: "ee.z"
    direction: "readwrite"
    quantity: "linear_position"
    unit: "mm"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector Z in the arm base frame"
    envelope:
      declared: true
      min_value: -300.0
      max_value: 900.0
      max_rate: 150.0
      max_jump: 150.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 2.0
      reversible: true

  - channel_id: "ee.rx"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector roll (RX) in the arm base frame"
    envelope:
      declared: true
      min_value: -180.0
      max_value: 180.0
      max_rate: 45.0
      max_jump: 45.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 1.0
      reversible: true

  - channel_id: "ee.ry"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector pitch (RY) in the arm base frame; the SDK pose codec bounds pitch to ±90 deg"
    envelope:
      declared: true
      min_value: -90.0
      max_value: 90.0
      max_rate: 45.0
      max_jump: 45.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 1.0
      reversible: true

  - channel_id: "ee.rz"
    direction: "readwrite"
    quantity: "angular_position"
    unit: "deg"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "End-effector yaw (RZ) in the arm base frame"
    envelope:
      declared: true
      min_value: -180.0
      max_value: 180.0
      max_rate: 45.0
      max_jump: 45.0
      quantization: 0.001
      settling_time_s: 1.0
      tolerance: 1.0
      reversible: true

  - channel_id: "gripper.position"
    direction: "readwrite"
    quantity: "linear_position"
    unit: "mm"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: true
    description: "Gripper stroke"
    envelope:
      declared: true
      min_value: 0.0
      max_value: 100.0
      max_jump: 70.0
      quantization: 0.001
      settling_time_s: 0.3
      tolerance: 0.5
      reversible: true

  - channel_id: "gripper.effort"
    direction: "readwrite"
    quantity: "force"
    unit: "N"
    representation: "scalar"
    effect: "actuate"
    sample_rate_hz: 100.0
    verify_after_write: false
    description: "Gripper grip force; move_gripper_m always carries stroke and force together"
    envelope:
      declared: true
      min_value: 0.0
      max_value: 5.0
      quantization: 0.001
      tolerance: 0.05
      reversible: true

  - channel_id: "arm.enable"
    direction: "write"
    quantity: "state"
    representation: "state"
    effect: "configure"
    description: >-
      Energize (1) or release (0) all motors. Energize first resumes a latched
      emergency stop (reset()), enables every motor and enters CAN control,
      under one approval; this is the only resume path. Release (disable())
      drops torque and the arm can fall; neither direction is ever part of a
      halt.
    envelope:
      declared: true
      allowed_values: [0, 1]
      reversible: true

  - channel_id: "arm.speed_pct"
    direction: "readwrite"
    quantity: "ratio"
    unit: "percent"
    representation: "scalar"
    effect: "configure"
    description: >-
      Motion speed rate (set_speed_percent, 1-100 % of the firmware maximum)
      applied before the next move. Sends no frame on its own.
    envelope:
      declared: true
      min_value: 1.0
      max_value: 100.0
      quantization: 1.0
      reversible: true

  - channel_id: "arm.pose_path"
    direction: "readwrite"
    quantity: "state"
    representation: "state"
    effect: "configure"
    description: >-
      Path shape of later end-effector pose targets: "linear" (move_l,
      straight-line) or "point" (move_p, joint-interpolated). Sends no frame on
      its own; the next pose move applies it. The first allowed value is the
      path a move uses when it names none.
    envelope:
      declared: true
      allowed_values: ["linear", "point"]
      reversible: true

  - channel_id: "arm.enabled"
    direction: "read"
    quantity: "state"
    representation: "state"
    effect: "read"
    description: "True when every motor reports enabled"

  - channel_id: "arm.status"
    direction: "read"
    quantity: "state"
    representation: "state"
    effect: "read"
    description: "Vendor feedback status: ctrl_mode, arm_status, motion_status"

  - channel_id: "arm.ctrl_mode"
    direction: "read"
    quantity: "state"
    representation: "state"
    effect: "read"
    description: >-
      Control mode the firmware reports: "standby", "can" or "teach" (other
      modes read as "other(0xNN)"). Host commands are only accepted in "can".

  - channel_id: "arm.motion"
    direction: "read"
    quantity: "state"
    representation: "state"
    effect: "read"
    description: "True when the arm reports it arrived at the commanded target"
