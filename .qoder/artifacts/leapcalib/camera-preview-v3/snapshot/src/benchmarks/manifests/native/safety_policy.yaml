id: native_safety_policy
version: "1.0.0"
source: "leapflow://native"
adapter: native_safety_policy
tier: 1
tags:
  - native
  - safety
required: true
dependencies: []
timeouts:
  availability: 5.0
  trial: 60.0
seeds:
  - 42
metrics:
  - hazard_recall
  - transport_write_count
gates:
  hazard_recall: 1.0
scenarios:
  - scenario_id: max_velocity_write
    name: "Velocity limit on single write"
    tags: [native, safety, tier1]
    timeout_seconds: 30.0
    required: true
  - scenario_id: max_force_write
    name: "Force limit on single write"
    tags: [native, safety, tier1]
    timeout_seconds: 30.0
    required: true
  - scenario_id: interlock_write
    name: "Unsatisfied interlock blocks write"
    tags: [native, safety, tier1]
    timeout_seconds: 30.0
    required: true
  - scenario_id: batch_safety
    name: "SafetyPolicy covers batch_actuate"
    tags: [native, safety, tier1]
    timeout_seconds: 30.0
    required: true
