id: native_degradation_recovery
version: "1.0.0"
source: "leapflow://native"
adapter: native_degradation_recovery
tier: 1
tags:
  - native
  - degradation
  - recovery
required: true
dependencies: []
timeouts:
  availability: 5.0
  trial: 60.0
seeds:
  - 42
metrics:
  - degradation_containment
gates:
  degradation_containment: 1.0
scenarios:
  - scenario_id: comm_loss_halt
    name: "Comm loss triggers halt"
    tags: [native, degradation, tier1]
    timeout_seconds: 30.0
    required: true
    parameters:
      sensor_loss: halt
      comm_loss: halt
  - scenario_id: comm_loss_hold
    name: "Comm loss triggers hold_position"
    tags: [native, degradation, tier1]
    timeout_seconds: 30.0
    required: true
    parameters:
      sensor_loss: halt
      comm_loss: hold_position
  - scenario_id: comm_loss_safe_return
    name: "Comm loss fails closed when safe_return cannot be verified"
    tags: [native, degradation, tier1]
    timeout_seconds: 30.0
    required: true
    parameters:
      sensor_loss: halt
      comm_loss: safe_return
  - scenario_id: sensor_loss_halt
    name: "Sensor loss triggers halt"
    tags: [native, degradation, tier1]
    timeout_seconds: 30.0
    required: true
    parameters:
      sensor_loss: halt
      comm_loss: halt
  - scenario_id: sensor_loss_switch
    name: "Sensor loss triggers switch_sensor"
    tags: [native, degradation, tier1]
    timeout_seconds: 30.0
    required: true
    parameters:
      sensor_loss: switch_sensor
      comm_loss: halt
